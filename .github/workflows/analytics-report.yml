name: Send analytics report

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production analytics report
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://quran-elhafez.com/api/cron/analytics-report"
