name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Vercel is the only runtime configuration source for the application.
env:
  LHCI_RUNS: ${{ github.event_name == 'pull_request' && '1' || '3' }}
  LIGHTHOUSE_URL: https://quran-elhafez.com

jobs:
  lighthouse:
    name: Lighthouse (${{ github.event_name == 'pull_request' && 'fast PR' || 'full main' }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: browser-actions/setup-chrome@v2
        id: chrome

      - name: Wait for Vercel deployment
        run: |
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --location "$LIGHTHOUSE_URL/" > /dev/null; then
              echo "Vercel deployment is reachable: $LIGHTHOUSE_URL"
              exit 0
            fi
            echo "Waiting for Vercel deployment (attempt $attempt/36)..."
            sleep 5
          done
          echo "Vercel deployment did not become reachable: $LIGHTHOUSE_URL"
          exit 1

      - name: Run Lighthouse CI against Vercel
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          pnpm dlx @lhci/cli@0.15.x autorun \
            --collect.url="$LIGHTHOUSE_URL/" \
            --collect.url="$LIGHTHOUSE_URL/blog" \
            --collect.url="$LIGHTHOUSE_URL/blog/quran-memorization-tools" \
            --collect.numberOfRuns="$LHCI_RUNS"
